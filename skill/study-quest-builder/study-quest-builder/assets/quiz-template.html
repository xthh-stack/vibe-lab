<script>
/* Pure operations are exposed for deterministic validation; the browser uses the same operations. */
(() => {
  'use strict';
  const hasDOM=typeof document!=='undefined';
  const config=hasDOM ? JSON.parse(document.getElementById('study-config').textContent) : globalThis.STUDY_CONFIG;
  const questionMap=new Map(config.questions.map(q=>[q.id,q])),levelMap=new Map(config.levels.map(l=>[l.id,l])),moduleMap=new Map(config.modules.map(m=>[m.id,m])),exampleMap=new Map((config.examples||[]).map(example=>[example.id,example]));
  const key=`study-quest:v1:${config.courseId}`;
  const clone=value=>JSON.parse(JSON.stringify(value));
  const now=()=>new Date().toISOString();
  const object=value=>value && typeof value==='object' && !Array.isArray(value);
  const own=(value,name)=>Object.prototype.hasOwnProperty.call(value,name);
  const date=value=>typeof value==='string' && Number.isFinite(Date.parse(value));
  const $=id=>document.getElementById(id);
  function status(text){if(hasDOM)$('status').textContent=text;}
  function fresh(){return {schemaVersion:1,kind:'study-progress',courseId:config.courseId,bankRevision:config.bankRevision,bestScores:Object.fromEntries(config.levels.map(l=>[l.id,0])),completed:[],unlocked:config.levels.filter(l=>!l.prerequisites.length).map(l=>l.id),wrongBook:{},session:null,updatedAt:now()};}
  let state=fresh();
  function save(){state.updatedAt=now();try{localStorage.setItem(key,JSON.stringify(state));}catch{status('本地保存失败，请导出学习记录备份。');}}
  function shuffle(array,rng=Math.random){const out=[...array];for(let i=out.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[out[i],out[j]]=[out[j],out[i]];}return out;}
  function weighted(pool,count,rng=Math.random){const remaining=[...pool],out=[];while(out.length<count && remaining.length){const total=remaining.reduce((sum,q)=>sum+moduleMap.get(q.moduleId).rating,0);let ticket=rng()*total,index=remaining.length-1;for(let i=0;i<remaining.length;i++){ticket-=moduleMap.get(remaining[i].moduleId).rating;if(ticket<0){index=i;break;}}out.push(remaining.splice(index,1)[0]);}return out;}
  function sample(levelId,rng=Math.random){const level=levelMap.get(levelId),pool=config.questions.filter(q=>q.levelId===levelId),groups=[...new Set(pool.map(q=>q.moduleId))];let selected=[];if(level.drawCount>=groups.length){selected=groups.map(id=>{const group=pool.filter(q=>q.moduleId===id);return group[Math.floor(rng()*group.length)];});}const used=new Set(selected.map(q=>q.id));selected.push(...weighted(pool.filter(q=>!used.has(q.id)),level.drawCount-selected.length,rng));return shuffle(selected,rng).map(q=>q.id);}
  function validAnswer(q,value){
    const ids=(q.choices||[]).map(c=>c.id);
    if(['single','boolean'].includes(q.type))return typeof value==='string' && ids.includes(value);
    if(q.type==='multiple')return Array.isArray(value) && value.length>0 && new Set(value).size===value.length && value.every(id=>ids.includes(id));
    return false;
  }
  function validDraft(q,value){return value===null||validAnswer(q,value)||(q.type==='multiple'&&Array.isArray(value)&&value.length===0);}
  function setDraft(value){const s=state.session;if(!s||s.finished||s.answers.length>s.index)return;const q=questionMap.get(s.questionIds[s.index]);if(!validDraft(q,value))throw Error('暂存答案格式无效');s.draft=clone(value);save();}
  function grade(q,value){if(!validAnswer(q,value))return false;if(['single','boolean'].includes(q.type))return value===q.answer;return value.length===q.answer.length && value.every(id=>q.answer.includes(id));}
  function answerText(q,value=q.answer){const label=id=>q.choices.find(c=>c.id===id)?.text||String(id);return Array.isArray(value)?value.map(label).join('；'):label(value);}
  function wrong(q,answer){const previous=state.wrongBook[q.id];state.wrongBook[q.id]={questionId:q.id,moduleId:q.moduleId,knowledgePoints:[...q.knowledgePoints],wrongCount:(previous?.wrongCount||0)+1,lastWrongAnswer:clone(answer),correctAnswer:clone(q.answer),explanation:q.explanation,lastWrongAt:now(),mastered:false};}
  function threshold(level,count){return Math.ceil(count*level.passRatio);}
  function coverModel(stateInput=state,configInput=config){return configInput.levels.map((level,index)=>({id:level.id,name:level.name,index,status:stateInput.completed.includes(level.id)?'已完成':stateInput.unlocked.includes(level.id)?'已解锁':'未解锁',unlocked:stateInput.unlocked.includes(level.id),completed:stateInput.completed.includes(level.id),best:Number(stateInput.bestScores[level.id]||0)}));}
  function finish(){const s=state.session;if(!s || s.finished || s.answers.length!==s.questionIds.length)return;const correct=s.answers.filter(a=>a.correct).length;s.finished=true;s.result={correct,total:s.questionIds.length,accuracy:100*correct/s.questionIds.length,passed:s.mode==='review'||correct>=threshold(levelMap.get(s.levelId),s.questionIds.length)};if(s.mode==='level'){state.bestScores[s.levelId]=Math.max(state.bestScores[s.levelId]||0,s.result.accuracy);if(s.result.passed && !state.completed.includes(s.levelId))state.completed.push(s.levelId);state.unlocked=config.levels.filter(l=>l.prerequisites.every(id=>state.completed.includes(id))).map(l=>l.id);}save();}
  function submit(answer){const s=state.session;if(!s || s.finished || s.answers.length>s.index)return false;const q=questionMap.get(s.questionIds[s.index]);if(!validAnswer(q,answer))throw Error('请完整填写答案');const correct=grade(q,answer);s.draft=clone(answer);s.answers.push({questionId:q.id,answer:clone(answer),correct});if(!correct)wrong(q,answer);save();return correct;}
  function next(){const s=state.session;if(!s||s.finished||s.answers.length<=s.index)return;if(s.index+1===s.questionIds.length)finish();else{s.index++;s.draft=null;save();}}
  function start(levelId,reviewIds){if(!reviewIds && !state.unlocked.includes(levelId))throw Error('请先通过前置关卡');const ids=reviewIds?shuffle([...new Set(reviewIds)]):sample(levelId);if(!ids.length || ids.some(id=>!questionMap.has(id)))throw Error('没有可复习题目');const options=Object.fromEntries(ids.map(id=>{const q=questionMap.get(id);return [id,shuffle((q.choices||q.right||[]).map(c=>c.id))];}));state.session={mode:reviewIds?'review':'level',levelId:reviewIds?null:levelId,questionIds:ids,options,index:0,answers:[],draft:null,finished:false};save();return clone(state.session);}
  function mastery(id){if(state.wrongBook[id]){state.wrongBook[id].mastered=!state.wrongBook[id].mastered;save();}}
  function validateBackup(input){
    try{
      const data=typeof input==='string'?JSON.parse(input):clone(input);
      const require=(ok,message)=>{if(!ok)throw Error(message);};
      require(object(data),'记录必须是对象');require(data.schemaVersion===1 && data.kind==='study-progress','不兼容的记录版本/类型');require(data.courseId===config.courseId,'课程不匹配');require(typeof data.bankRevision==='string' && date(data.updatedAt),'题库版本或时间无效');
      require(object(data.bestScores) && Object.entries(data.bestScores).every(([id,v])=>levelMap.has(id)&&typeof v==='number'&&Number.isFinite(v)&&v>=0&&v<=100),'最高正确率无效');
      for(const field of ['completed','unlocked'])require(Array.isArray(data[field])&&new Set(data[field]).size===data[field].length&&data[field].every(id=>levelMap.has(id)),`${field} 含未知或重复关卡`);
      require(data.completed.every(id=>levelMap.get(id).prerequisites.every(p=>data.completed.includes(p))),'完成记录缺少前置关卡');
      const expected=config.levels.filter(l=>l.prerequisites.every(id=>data.completed.includes(id))).map(l=>l.id);
      require(data.unlocked.every(id=>expected.includes(id)),'解锁与完成记录冲突');
      require(object(data.wrongBook),'错题本格式无效');
      for(const [id,record] of Object.entries(data.wrongBook)){const q=questionMap.get(id);require(q&&object(record)&&record.questionId===id&&record.moduleId===q.moduleId,`未知错题或映射：${id}`);require(Number.isInteger(record.wrongCount)&&record.wrongCount>0&&typeof record.mastered==='boolean'&&date(record.lastWrongAt)&&validAnswer(q,record.lastWrongAnswer),'错题字段无效');require(Array.isArray(record.knowledgePoints)&&record.knowledgePoints.every(v=>typeof v==='string')&&typeof record.explanation==='string'&&own(record,'correctAnswer'),'错题内容字段缺失');record.correctAnswer=clone(q.answer);record.explanation=q.explanation;record.knowledgePoints=[...q.knowledgePoints];}
      require(data.session===null||object(data.session),'答题状态无效');
      if(data.session){const s=data.session;require(['level','review'].includes(s.mode)&&typeof s.finished==='boolean','轮次类型无效');require(Array.isArray(s.questionIds)&&s.questionIds.length>0&&new Set(s.questionIds).size===s.questionIds.length&&s.questionIds.every(id=>questionMap.has(id)),'轮次题目无效');if(s.mode==='level')require(levelMap.has(s.levelId)&&expected.includes(s.levelId)&&s.questionIds.length===levelMap.get(s.levelId).drawCount&&s.questionIds.every(id=>questionMap.get(id).levelId===s.levelId),'轮次与关卡不匹配');else require(s.levelId===null,'复习轮次关卡无效');require(Number.isInteger(s.index)&&s.index>=0&&s.index<s.questionIds.length,'当前题号无效');require(Array.isArray(s.answers)&&s.answers.length>=s.index&&s.answers.length<=s.index+1,'提交数量无效');require(object(s.options),'选项顺序缺失');s.questionIds.forEach(id=>{const q=questionMap.get(id),ids=(q.choices||q.right||[]).map(c=>c.id),order=s.options[id];require(Array.isArray(order)&&order.length===ids.length&&new Set(order).size===ids.length&&order.every(x=>ids.includes(x)),'选项顺序无效');});s.answers.forEach((a,i)=>{const q=questionMap.get(s.questionIds[i]);require(object(a)&&a.questionId===q.id&&validAnswer(q,a.answer)&&typeof a.correct==='boolean'&&a.correct===grade(q,a.answer),'已提交答案无效');});require(validDraft(questionMap.get(s.questionIds[s.index]),s.draft),'暂存答案无效');if(s.finished){require(s.index===s.questionIds.length-1&&s.answers.length===s.questionIds.length,'结算状态无效');const correct=s.answers.filter(a=>a.correct).length;s.result={correct,total:s.questionIds.length,accuracy:100*correct/s.questionIds.length,passed:s.mode==='review'||correct>=threshold(levelMap.get(s.levelId),s.questionIds.length)};}}
      data.bestScores={...fresh().bestScores,...data.bestScores};data.unlocked=expected;data.bankRevision=config.bankRevision;
      if(own(data,'exportedAt'))require(date(data.exportedAt),'导出时间无效');return {ok:true,data};
    }catch(error){return {ok:false,error:error.message};}
  }
  function importBackup(input){const result=validateBackup(input);if(!result.ok)throw Error(result.error);state=result.data;save();return clone(state);}
  function reset(){state=fresh();try{localStorage.removeItem(key);}catch{status('无法清除本地记录，请检查浏览器存储设置。');}save();}
  function exportData(){return {...clone(state),exportedAt:now()};}
  try{const raw=localStorage.getItem(key);if(raw){const result=validateBackup(raw);if(result.ok)state=result.data;else status(`本地记录未载入：${result.error}。请保留原备份并检查版本。`);}}catch{status('无法读取本地记录，请使用导入/导出备份。');}
  globalThis.studyQuest={config,sample,weighted,grade,validAnswer,answerText,start,setDraft,submit,next,finish,mastery,validateBackup,importBackup,exportData,reset,getState:()=>clone(state),threshold,coverModel};
  if(!hasDOM)return;
  function el(tag,text,className){const node=document.createElement(tag);if(text!==undefined)node.textContent=text;if(className)node.className=className;return node;}
  const svgNS='http://www.w3.org/2000/svg';
  function svgEl(tag,attributes={}){const node=document.createElementNS(svgNS,tag);for(const [name,value] of Object.entries(attributes))node.setAttribute(name,String(value));return node;}
  function renderCover(model){const section=el('section',undefined,'cover');section.append(el('h2','信号学习轨迹'),el('p','节点高度表示历史最高正确率，颜色表示当前解锁状态。'));const svg=svgEl('svg',{viewBox:'0 0 760 230',role:'img','aria-label':'关卡解锁状态与历史最高正确率'});svg.append(svgEl('line',{x1:40,y1:190,x2:730,y2:190,stroke:'#94b8ae','stroke-width':2}),svgEl('line',{x1:40,y1:25,x2:40,y2:190,stroke:'#94b8ae','stroke-width':2}),svgEl('path',{d:'M40 120 C120 35 210 205 300 110 S480 35 570 120 S680 195 730 95',fill:'none',stroke:'#3a7974','stroke-width':2,'stroke-dasharray':'5 7'}));model.forEach((item,index)=>{const x=model.length===1?380:80+index*(620/(model.length-1)),y=180-item.best*1.35,color=item.completed?'#77d6a4':item.unlocked?'#ffd166':'#6f8580';svg.append(svgEl('line',{x1:x,y1:190,x2:x,y2:y,stroke:color,'stroke-width':3}));const dot=svgEl('circle',{cx:x,cy:y,r:10,fill:color,stroke:'#f7fbf8','stroke-width':2});svg.append(dot);const name=svgEl('text',{x,y:210,fill:'#f7fbf8','text-anchor':'middle'});name.textContent=item.name;const score=svgEl('text',{x,y:y-16,fill:'#f7fbf8','text-anchor':'middle'});score.textContent=`${item.best.toFixed(0)}% · ${item.status}`;svg.append(name,score);});section.append(svg);return section;}
  function renderExample(question){const example=exampleMap.get(question.exampleId);if(!example)return null;const section=el('section',undefined,'example');section.append(el('h3',`原题复现 · ${example.source}`),el('p',example.stem));const conditions=el('ul');example.conditions.forEach(value=>conditions.append(el('li',value)));section.append(conditions);example.formulas.forEach(value=>section.append(el('p',`公式：${value}`,'meta')));if(example.figure.kind==='polyline'){const figure=example.figure,svg=svgEl('svg',{viewBox:figure.viewBox,role:'img','aria-label':'原题波形图'});for(const axis of [figure.xAxis,figure.yAxis]){svg.append(svgEl('line',{x1:axis.from[0],y1:axis.from[1],x2:axis.to[0],y2:axis.to[1],stroke:'#233332','stroke-width':2}));const label=svgEl('text',{x:axis.to[0],y:axis.to[1]-4,fill:'#233332'});label.textContent=axis.label;svg.append(label);}svg.append(svgEl('polyline',{points:figure.points.map(point=>point.join(',')).join(' '),fill:'none',stroke:'var(--accent)','stroke-width':4}));figure.labels.forEach(item=>{const label=svgEl('text',{x:item.at[0],y:item.at[1],fill:'#233332','text-anchor':'middle'});label.textContent=item.text;svg.append(label);});section.append(svg);}return section;}
  function focusContent(node){node.tabIndex=-1;node.focus();}
  function button(text,action,primary=false){const node=el('button',text);if(primary)node.className='primary';node.addEventListener('click',()=>{try{action();}catch(error){status(error.message);}});return node;}
  function show(view){for(const id of ['home','quiz','wrong','import'])$(`${id}-view`).hidden=id!==view;}
  function home(){show('home');const root=$('home-view'),model=coverModel();root.replaceChildren(renderCover(model));if(state.session&&!state.session.finished)root.append(button('继续未完成答题',renderQuiz,true));model.forEach(item=>{const level=levelMap.get(item.id),card=el('article',undefined,'card track');card.append(el('h2',`${String(item.index+1).padStart(2,'0')} / ${level.name}`),el('p',level.description),el('p',`每轮 ${level.drawCount} 题 · 正确率达到 80% 通关 · 最高 ${item.best.toFixed(1)}%`,'meta'),el('p',`前置：${level.prerequisites.map(id=>levelMap.get(id).name).join('、')||'无'} · ${item.status}`,'meta'));const go=button('开始新一轮',()=>{if(state.session&&!state.session.finished&&!confirm('开始新一轮将替换当前未完成答题，继续？'))return;start(level.id);renderQuiz();},true);go.disabled=!item.unlocked;card.append(go);root.append(card);});}
  function readInput(q,field){if(['single','boolean'].includes(q.type))return field.querySelector('input:checked')?.value||null;return [...field.querySelectorAll('input:checked')].map(node=>node.value);}
  function renderQuiz(){show('quiz');const root=$('quiz-view');root.replaceChildren();const s=state.session;if(!s){home();return;}if(s.finished){const result=s.result;root.append(el('h2',s.mode==='review'?'复习完成':result.passed?'本关通过':'继续练习'),el('p',`${result.correct} / ${result.total} · 正确率 ${result.accuracy.toFixed(1)}%`),button('返回关卡轨迹',home),button('查看错题',()=>wrongView('pending')));focusContent(root.querySelector('h2'));return;}const q=questionMap.get(s.questionIds[s.index]),submitted=s.answers[s.index],draft=submitted?.answer??s.draft;root.append(el('p',`${s.mode==='review'?'错题复习':levelMap.get(s.levelId).name} · ${s.index+1} / ${s.questionIds.length} · 已答对 ${s.answers.filter(a=>a.correct).length} 题`,'meta'));const progress=el('progress');progress.max=s.questionIds.length;progress.value=s.answers.length;progress.setAttribute('aria-label','作答进度');root.append(progress);const card=el('article',undefined,'card');if(q.type==='multiple')card.append(el('p','多选题 · 全部选对才得分','question-kind'));card.append(el('h2',q.prompt),el('p',`${moduleMap.get(q.moduleId).name} · ${q.source}`,'meta'));const example=renderExample(q);if(example)card.append(example);const field=el('fieldset');field.append(el('legend','选择答案'));const order=s.options[q.id];
    if(['single','boolean','multiple'].includes(q.type)){order.forEach(id=>{const choice=q.choices.find(c=>c.id===id),label=el('label',undefined,'answer-row'),input=el('input');input.type=q.type==='multiple'?'checkbox':'radio';input.name='answer';input.value=id;input.checked=q.type==='multiple'?Array.isArray(draft)&&draft.includes(id):draft===id;label.append(input,el('span',choice.text));field.append(label);});}
    field.disabled=!!submitted;field.addEventListener('input',()=>{const value=readInput(q,field);if(validDraft(q,value))setDraft(value);});card.append(field);const submitButton=button('提交答案',()=>{submit(readInput(q,field));renderQuiz();},true);submitButton.disabled=!!submitted;card.append(submitButton);if(submitted){const feedback=el('div',`${submitted.correct?'回答正确':'回答错误'}\n正确答案：${answerText(q)}\n解释：${q.explanation}`,'result');feedback.id='feedback';feedback.setAttribute('aria-live','polite');card.append(feedback,button(s.index+1===s.questionIds.length?'查看结果':'下一题',()=>{next();renderQuiz();},true));}root.append(card);focusContent(submitted?$('feedback'):card.querySelector('h2'));
  }
  function wrongView(filter='pending'){show('wrong');const root=$('wrong-view');root.replaceChildren(el('h2','错题复习'));const entries=Object.entries(state.wrongBook).filter(([,r])=>filter==='all'||!r.mastered);const actions=el('div',undefined,'actions');actions.append(button('待复习',()=>wrongView('pending')),button('全部记录',()=>wrongView('all')),button('开始复习当前列表',()=>{if(state.session&&!state.session.finished&&!confirm('错题复习将替换当前未完成答题，继续？'))return;start(null,entries.map(([id])=>id));renderQuiz();},true));root.append(actions);if(!entries.length)root.append(el('p','当前没有符合条件的错题。'));entries.forEach(([id,r])=>{const q=questionMap.get(id),card=el('article',undefined,'card');card.append(el('h2',q.prompt),el('p',`${moduleMap.get(q.moduleId).name} · 错误 ${r.wrongCount} 次 · ${r.mastered?'已掌握':'待复习'}`,'meta'),el('p',`最近错误答案：${answerText(q,r.lastWrongAnswer)}`),el('p',`正确答案：${answerText(q)}`),el('p',q.explanation),button(r.mastered?'标记待复习':'标记已掌握',()=>{mastery(id);wrongView(filter);}));root.append(card);});}
  function download(){const url=URL.createObjectURL(new Blob([JSON.stringify(exportData(),null,2)],{type:'application/json'}));const a=el('a');a.href=url;a.download=`${config.courseId}-progress-${new Date().toISOString().slice(0,10)}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
  let pendingImport=null;
  $('course-title').textContent=config.courseTitle;document.title=`${config.courseTitle} · 闯关复习`;
  for(const [name,value] of Object.entries(config.theme||{}))if(['accent','paper'].includes(name)&&/^#[0-9a-f]{6}$/i.test(value))document.documentElement.style.setProperty(`--${name}`,value);
  $('home-button').addEventListener('click',home);$('wrong-button').addEventListener('click',()=>wrongView('pending'));$('export-button').addEventListener('click',download);$('backup-button').addEventListener('click',()=>show('import'));
  $('import-file').addEventListener('change',async event=>{pendingImport=null;$('import-preview').hidden=true;$('import-error').textContent='';try{const file=event.target.files[0];if(!file)return;if(file.size>5*1024*1024)throw Error('备份超过 5 MB，请检查文件');const result=validateBackup(await file.text());if(!result.ok)throw Error(result.error);pendingImport=result.data;$('import-preview').hidden=false;}catch(error){$('import-error').textContent=error.message;}});
  $('confirm-import').addEventListener('click',()=>{if(!pendingImport)return;try{importBackup(pendingImport);pendingImport=null;$('import-preview').hidden=true;status('学习记录已导入。');home();}catch(error){$('import-error').textContent=error.message;}});
  $('cancel-import').addEventListener('click',()=>{pendingImport=null;$('import-preview').hidden=true;home();$('backup-button').focus();});
  $('reset-button').addEventListener('click',()=>{$('reset-preview').hidden=false;$('confirm-reset').focus();});$('cancel-reset').addEventListener('click',()=>{$('reset-preview').hidden=true;$('reset-button').focus();});$('confirm-reset').addEventListener('click',()=>{reset();pendingImport=null;$('import-preview').hidden=true;$('import-file').value='';$('reset-preview').hidden=true;home();status('本课程学习记录已清空，题库与评分保留。');});home();
})();
</script></body></html>
